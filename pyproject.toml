[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aquarium-manager"
version = "0.1.0"
description = "Local Aquarium Manager application"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "nicegui>=2,<4",
    "pillow>=10,<13",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]
test = ["pytest>=8,<9"]

[project.scripts]
aqman = "aqman.__main__:main"

[tool.setuptools.packages.find]
include = ["aqman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
